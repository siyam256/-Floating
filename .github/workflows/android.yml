name: Android CI/CD (Generate APK)

# CI Trigger Comment: Rebuilt and verified with Gradle 9.3.1 and local tests fixed.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Convert Line Endings for Gradle Wrapper
      run: |
        if [ -f gradlew ]; then
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
        fi

    - name: Create .env from .env.example
      run: |
        if [ -f .env.example ]; then
          cp .env.example .env
        else
          echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
        fi

    - name: Prepare Debug Keystore
      run: |
        if [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
          echo "Decoding debug.keystore.base64..."
          base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
        fi
        
        if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
          echo "Creating a fresh, valid debug.keystore..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        echo "Keystore is ready:"
        ls -la debug.keystore

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'
        validate-wrappers: false

    - name: Build with Gradle
      run: |
        if command -v gradle &> /dev/null; then
          echo "Using configured Gradle executable..."
          gradle :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace
        else
          echo "Falling back to gradlew..."
          ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace
        fi

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Floating-Browser-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

