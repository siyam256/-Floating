name: Android CI/CD (Generate APK)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Convert Line Endings for Gradle Wrapper
      run: sed -i 's/\r$//' gradlew

    - name: Create .env from .env.example
      run: cp .env.example .env

    - name: Decode Debug Keystore
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
          echo "debug.keystore successfully decoded. Size: $(wc -c < debug.keystore) bytes"
        elif [ -f debug.base64 ]; then
          base64 -d debug.base64 > debug.keystore
          echo "debug.keystore successfully decoded. Size: $(wc -c < debug.keystore) bytes"
        else
          echo "Error: Keystore base64 file not found!"
          exit 1
        fi

    - name: Grant Execute Permission to Gradle Wrapper
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Floating-Browser-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
